<!DOCTYPE html><html lang="en">
    <head>
      <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Apology Website 🤍</title>
            <style>
                * { box-sizing: border-box; }
                    body {
                          margin: 0;
                                min-height: 100vh;
                                      font-family: Arial, sans-serif;
                                            background: linear-gradient(160deg, #3b1727, #170f18);
                                                  color: #ffe5ef;
                                                        display: flex;
                                                              align-items: center;
                                                                    justify-content: center;
                                                                          padding: 24px;
                                                                              }
                                                                                  .card {
                                                                                        width: 100%;
                                                                                              max-width: 420px;
                                                                                                    text-align: center;
                                                                                                          padding: 32px 22px;
                                                                                                                background: rgba(255,255,255,.07);
                                                                                                                      border: 1px solid rgba(255,255,255,.15);
                                                                                                                            border-radius: 25px;
                                                                                                                                  box-shadow: 0 15px 45px #0005;
                                                                                                                                      }
                                                                                                                                          h1 { color: #ff9fc4; font-size: 30px; }
                                                                                                                                              p { line-height: 1.7; color: #f8c9dc; }
                                                                                                                                                  .choice {
                                                                                                                                                        display: block;
                                                                                                                                                              width: 100%;
                                                                                                                                                                    margin: 13px 0;
                                                                                                                                                                          padding: 16px;
                                                                                                                                                                                border: 0;
                                                                                                                                                                                      border-radius: 30px;
                                                                                                                                                                                            background: #ed78a6;
                                                                                                                                                                                                  color: #29131f;
                                                                                                                                                                                                        font-size: 17px;
                                                                                                                                                                                                              font-weight: bold;
                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                        }
                                                                                                                                                                                                                            .choice:nth-of-type(2) { background: #f7c4d8; }
                                                                                                                                                                                                                                .choice:nth-of-type(3) { background: #b87caa; }
                                                                                                                                                                                                                                    #next { display: none; }
                                                                                                                                                                                                                                      </style>
                                                                                                                                                                                                                                      </head>
                                                                                                                                                                                                                                      <body>
                                                                                                                                                                                                                                        <main class="card">
                                                                                                                                                                                                                                            <section id="start">
                                                                                                                                                                                                                                                  <p>TO MY FAVOURITE PERSON 🤍</p>
                                                                                                                                                                                                                                                        <h1>I'm truly sorry, ma 🥹</h1>
                                                                                                                                                                                                                                                              <p>I made this little website just for you. Please open it whenever you're ready.</p>
                                                                                                                                                                                                                                                                    <p>Choose whatever your heart feels. No pressure. 🤍</p>
                                                                                                                                                                                                                                                                          <button class="choice" onclick="begin('Yes 🤍')">Yes</button>
                                                                                                                                                                                                                                                                                <button class="choice" onclick="begin('I need time 😌')">I need time 😌</button>
                                                                                                                                                                                                                                                                                      <button class="choice" onclick="begin('Never ever')">Never ever</button>
                                                                                                                                                                                                                                                                                          </section>
                                                                                                                                                                                                                                                                                              <section id="next">
                                                                                                                                                                                                                                                                                                    <h1 id="choiceTitle"></h1>
                                                                                                                                                                                                                                                                                                          <p>Thank you for being honest with me. Take your time, ma. 🤍</p>
                                                                                                                                                                                                                                                                                                                <p>There's something heartfelt I would like to share with you.</p>
                                                                                                                                                                                                                                                                                                                    </section>
                                                                                                                                                                                                                                                                                                                      </main>
                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                            function begin(choice) {
                                                                                                                                                                                                                                                                                                                                  document.getElementById('start').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                        document.getElementById('next').style.display = 'block';
                                                                                                                                                                                                                                                                                                                                              document.getElementById('choiceTitle').textContent = choice;
                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                    </html>
